version: 2

updates:
  # Versions are pinned exactly (no ^, no ~) so every update is a reviewed,
  # deliberate change with CI behind it — bootstrap brief §7.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
      # Majors arrive one at a time. Two of these pins are deliberately behind
      # the newest release (TypeScript 6 not 7, ESLint 9 not 10 — see
      # CLAUDE.md §4), so a major bump needs reading, not merging.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # @types/node tracks the RUNTIME major, not the newest published types.
      # 26.x describes Node APIs that do not exist in the version we run, so
      # accepting a major here would let code typecheck against functions that
      # are absent at runtime. Revisit when the runtime moves (OQ-A).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'build(docker)'
